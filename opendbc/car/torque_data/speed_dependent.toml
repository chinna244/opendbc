# Refreshed 2026-08-03 straight from the comma 4's LiveTorqueParameters cache
# (per-bin SVD fits, all learned on the current bin layout so laf needs no
# STEER_MAX rescaling). Samples per bin: 7072 / 8297 / 7765 / 11936 / 12000 (cap).
# Bins 28.0 and 35.0 have never gone valid (520 / 0 samples) and keep their
# previous seed values.
speed_bp    = [6.5, 9.5, 12.0, 16.4, 21.0, 28.0, 35.0]
laf_bp      = [2.30, 2.53, 2.23, 1.09, 1.10, 1.33, 1.61]
