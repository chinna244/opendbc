# Speed-dependent torque parameters — per-car speed-binned config.
#
# Each entry maps a car fingerprint to:
#   speed_bp    — speed breakpoints in m/s (bin centers)
#   laf_bp      — latAccelFactor at each speed
#   friction_bp — friction coefficient at each speed
#
# The online learner (torque estimator) runs independent SVD fits per speed bin.
# laf_bp/friction_bp provide starting values and define +/-30% sanity bounds.
#
# Values from comma 4 device-learned data.

[MAZDA_CX5_2022]
# STEER_MAX cliff 1200→800 at 32 mph. Bin boundary at 14.2 m/s aligns with cliff.
# Bins 0-2: SM=1200 (full low-speed authority). Bins 3-6: SM=800 (22% PID headroom).
# Refreshed 2026-08-19 straight from the comma 4's LiveTorqueParameters cache
# (per-bin SVD fits, all learned on the current bin layout so laf needs no
# STEER_MAX rescaling). First refresh with all 7 bins valid: the 28.0 and 35.0
# highway bins are learned now, no longer carrying 08-03 seed values. Bin 1's
# LAF (2.53 -> 2.93) had drifted toward the old +30% sanity edge; this refresh
# re-centers the bounds on it.
speed_bp    = [6.5, 9.5, 12.0, 16.4, 21.0, 28.0, 35.0]
laf_bp      = [2.43, 2.93, 2.37, 1.21, 1.16, 1.53, 1.76]
friction_bp = [0.156, 0.142, 0.124, 0.153, 0.139, 0.122, 0.108]

[MAZDA_CX9_2021]
# Measured on an EPS-SWAPPED CX-9 2021 running the CX-5 2022 donor EPS
# (KSD5/KBST firmware, STEER_TO_ZERO_EPS_FW), under that EPS's STEER_MAX
# schedule (1200 below the 14.2 m/s cliff, 800 above) and cliff-aligned bin
# layout. The stock CX-9 2021 EPS (TC3M) keeps a 45 kph floor and a flat 800,
# so these LAF values would be mis-scaled there — requires_steer_to_zero
# suppresses the entry unless the swap is fingerprinted (minSteerSpeed == 0).
requires_steer_to_zero = true
# Refreshed 2026-08-25 from this car's own LiveTorqueParameters cache, read off
# route 00000012--eba222b1f2 (2026-08-23). Bins 6.5-16.4 were learning live in
# that drive; 21.0 and 28.0 came out of the cache from earlier drives on the
# same car (that route saw nothing above 18.7 m/s) but are still this CX-9's
# own measurements, replacing the CX-5 values they were seeded from. Every bin
# lands well inside the sanity bounds of the seed it replaces - nothing was
# clipped. 35.0 has still never gone valid on this car, so its laf is scaled up
# from the CX-5's learned 1.76: the CX-9 runs 10-13% above the CX-5 in both
# highway bins it has measured (21.0 x1.10, 28.0 x1.13), and applying the CX-5's
# own 28->35 rise to the CX-9's 28.0 lands in the same place (1.96 vs 1.98).
# Friction shows no such offset (x1.01 across those bins) and keeps the CX-5
# value. Erring high on laf is the quiet direction - it asks for less torque.
speed_bp    = [6.5, 9.5, 12.0, 16.4, 21.0, 28.0, 35.0]
laf_bp      = [2.67, 2.70, 2.56, 1.53, 1.28, 1.72, 1.97]
friction_bp = [0.161, 0.154, 0.116, 0.163, 0.136, 0.128, 0.108]
